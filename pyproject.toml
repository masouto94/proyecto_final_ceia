[project]
name = "proyecto-final-ceia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=0.25.0",
    "pandas>=3.0.5",
    "pyarrow>=18.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "jupyter>=1.1.1"]

[project.scripts]
sample-amazon-reviews = "proyecto_final_ceia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proyecto_final_ceia"]
